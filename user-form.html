<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<body>

  <div class="container">
    <h2 class="text-center mb-4">User Registration Form</h2>
    <form action="submit_form.php" method="POST" enctype="multipart/form-data">

      <!-- Personal Details -->
      <fieldset>
        <legend>Personal Details</legend>
        <div class="row g-3">
          <div class="col-md-4">
            <label for="fname" class="form-label">First Name</label>
            <input type="text" class="form-control" id="fname" name="fname" required>
          </div>
          <div class="col-md-4">
            <label for="mname" class="form-label">Middle Name</label>
            <input type="text" class="form-control" id="mname" name="mname">
          </div>
          <div class="col-md-4">
            <label for="lname" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lname" name="lname" required>
          </div>
          <div class="col-12">
            <label for="fatherName" class="form-label">Father's Name</label>
            <input type="text" class="form-control" id="fatherName" name="father_name" required>
          </div>
          <div class="col-md-4">
            <label for="gender" class="form-label">Gender</label>
            <select name="gender" id="gender" class="form-select" required>
              <option value="">Choose...</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="dob" class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="dob" name="dob" required>
          </div>
          <div class="col-md-4">
            <label for="blood" class="form-label">Blood Group</label>
            <select name="blood" id="blood" class="form-select" required>
                <option value="">Select...</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
              </select>
              
          </div>
          <div class="col-md-12">
            <label for="occupation" class="form-label">Occupation</label>
            <select name="occupation" id="occupation" class="form-select" required>
                <option value="">Select...</option>
                <option value="Student">Student</option>
                <option value="Engineer">Engineer</option>
                <option value="Doctor">Doctor</option>
                <option value="Teacher">Teacher</option>
                <option value="Business">Business</option>
                <option value="Government Employee">Government Employee</option>
                <option value="Private Employee">Private Employee</option>
                <option value="Freelancer">Freelancer</option>
                <option value="Other">Other</option>
              </select>
              
          </div>
        </div>
      </fieldset>

      <!-- Contact Details -->
      <fieldset>
        <legend>Contact Details</legend>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="number" class="form-label">Contact Number</label>
            <input type="number" class="form-control" id="number" name="contact" required>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="col-md-3">
            <label for="house-number" class="form-label">House Number</label>
            <input type="text" class="form-control" id="house-number" name="house_no">
          </div>
          <div class="col-md-3">
            <label for="street" class="form-label">Street</label>
            <input type="text" class="form-control" id="street" name="street" required>
          </div>
          <div class="col-md-3">
            <label for="ward-number" class="form-label">Ward Number</label>
            <input type="number" class="form-control" id="ward-number" name="ward-no" required>
          </div>
          <div class="col-md-3">
            <label for="address" class="form-label">Full Address</label>
            <input type="text" class="form-control" id="address" name="address" required>
          </div>
        </div>
      </fieldset>

      <!-- Upload Section -->
      <fieldset>
        <legend>Upload Document</legend>
        <div class="row g-3">
          <div class="col-md-4">
            <label for="document-type" class="form-label">Document Type</label>
            <select name="document-type" id="document-type" class="form-select" required>
              <option value="">Choose...</option>
              <option value="Driving-License" selected>Driving License</option>
              <option value="Aadhar">Aadhar</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Document Number</label>
            <input type="text" name="document-number" id="license-number" class="form-control" placeholder="Driving License Number">
            <input type="number" name="document-number" id="aadhar-number" class="form-control" placeholder="Aadhar Number">
          </div>
          <div class="col-md-4">
            <label for="document-file" class="form-label">Upload Document</label>
            <input type="file" name="document-file" id="document-file" class="form-control" required>
          </div>
        </div>
      </fieldset>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary px-4">Submit</button>
        <button type="reset" class="btn btn-danger px-4">Reset</button>
      </div>
    </form>
  </div>
